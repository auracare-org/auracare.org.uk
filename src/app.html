<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			The `?v=` is a cache-buster, not decoration. Browsers keep favicons in a
			separate icon cache keyed on URL, and Safari's in particular ignores the
			`max-age=0, must-revalidate` the server already sends — so replacing the
			art at the same path left the old mark showing on every load until the
			cache happened to turn over. Bump the number whenever the icon changes.

			The PNG is declared alongside as a raster fallback: an SVG favicon is not
			universally supported, and without one those browsers fall back to
			/favicon.ico, which does not exist here.
		-->
		<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
		<link rel="icon" href="/icon-192.png?v=2" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/icon-192.png?v=2" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#2f4ec0" />

		<meta name="author" content="Auracare Health Ltd" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
